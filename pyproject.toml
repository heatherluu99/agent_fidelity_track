[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-fidelity"
version = "0.1.0"
description = "Trace capture and Bayesian fidelity scoring for AI agents acting in closed physical loops."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scipy>=1.10"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.37", "altair>=5", "pandas>=2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agent_fidelity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
